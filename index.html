<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secret Santa Draw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, festive, but tidy and trustworthy — a tool people use on a phone.
   IDEA: a gift tag — each match is a folded tag you only open with your own code.
   PICTURE: the working app itself; the reveal is a big swinging gift tag.
   COLOUR and TYPE: pine green field, white tags, berry red accent, a touch of gold; Bagel Fat One + Nunito.
   LAYOUT: one calm column, segmented switch at top, families as cards, results as a send list. */
:root{color-scheme:light dark;
--bg:light-dark(#0f3d2e,#0a2219);--panel:light-dark(#ffffff,#13281f);--ink:light-dark(#14231c,#eef5f0);
--soft:light-dark(#5c6e65,#9fb5aa);--line:light-dark(#dfe7e2,#24433a);--red:#d1263b;--gold:#e3b23c;--field:light-dark(#f4f7f5,#0d1f18)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:clamp(20px,4vw,44px) max(4vw,14px) 60px}
h1{font:400 clamp(32px,7vw,48px)/1.05 'Bagel Fat One',system-ui;color:#fff;margin:0 0 6px;text-wrap:balance}
.sub{color:#cfe3d8;margin:0 0 22px}
.seg{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:4px;margin-bottom:22px}
.seg button{flex:1;min-height:44px;border:0;border-radius:999px;background:none;color:#e6f1eb;font:800 16px Nunito,sans-serif;cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;color:#0f3d2e}
.card{background:var(--panel);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.card h2{font:800 19px/1.3 Nunito,sans-serif;margin:0 0 10px}
.muted{color:var(--soft);font-size:14px;margin:0 0 12px}
input{font:16px Nunito,sans-serif;width:100%;min-height:44px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink)}
input:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.famhead{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.famhead input{font-weight:800}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) 44px;gap:8px;margin-bottom:8px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font:800 15px Nunito,sans-serif;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.big{width:100%;min-height:54px;font-size:18px;border-radius:14px}
.x{width:44px;padding:0;color:var(--soft);font-size:20px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
label{font-weight:800;font-size:14px;display:block;margin-bottom:4px}
.err{background:#fde8eb;color:#8a1022;border-radius:12px;padding:12px 14px;margin:0 0 14px;font-weight:600}
.send{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.send:first-of-type{border-top:0}
.send b{font-size:17px}.send small{display:block;color:var(--soft);font-size:13px;overflow-wrap:anywhere}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.acts a{display:inline-flex;align-items:center;text-decoration:none}
.done{opacity:.55}
.tick{color:#1f8a4c;font-weight:800;font-size:13px}
.code{font:800 22px/1.3 ui-monospace,Menlo,monospace;letter-spacing:.04em;text-transform:uppercase;text-align:center}
.tagzone{display:flex;justify-content:center;padding:10px 0 4px}
.tag{position:relative;width:min(320px,90%);background:#fff;color:#14231c;border-radius:14px 14px 14px 14px;padding:46px 22px 26px;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.35);transform-origin:50% 0;animation:swing 1.6s ease-out}
.tag::before{content:"";position:absolute;top:14px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 3px var(--gold)}
.tag .to{font-size:15px;color:#5c6e65;margin:0}
.tag .name{font:400 clamp(34px,9vw,46px)/1.05 'Bagel Fat One',system-ui;color:var(--red);margin:10px 0 8px;overflow-wrap:anywhere}
.tag .meta{font-size:14px;color:#5c6e65;margin:0}
@keyframes swing{0%{transform:rotate(-14deg) translateY(-20px);opacity:0}40%{transform:rotate(8deg);opacity:1}70%{transform:rotate(-3deg)}100%{transform:none}}
@media(prefers-reduced-motion:reduce){.tag{animation:none}}
.note{color:#cfe3d8;font-size:13px;margin:16px 4px 0}
@media(max-width:600px){.row{grid-template-columns:minmax(0,1fr) 44px}.row .contact{grid-column:1/2}.grid2{grid-template-columns:minmax(0,1fr)}.send{grid-template-columns:minmax(0,1fr)}.acts{justify-content:flex-start}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Secret Santa</h1>
  <p class="sub">Family-proof draw. Everyone gets a private code; only they can open their match.</p>
  <div class="seg" role="group" aria-label="Mode">
    <button id="tabOrg" aria-pressed="true">Organise the draw</button>
    <button id="tabRev" aria-pressed="false">Reveal my match</button>
  </div>
  <main id="app"></main>
  <p class="note">Matches are never shown on the organiser's screen and aren't stored anywhere — each one lives only inside that person's code.</p>
</div>
<script>
{
const A='0123456789ABCDEFGHJKMNPQRSTVWXYZ';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function b32(bytes){let bits=0,val=0,out='';for(const b of bytes){val=(val<<8)|b;bits+=8;while(bits>=5){out+=A[(val>>>(bits-5))&31];bits-=5}val&=(1<<bits)-1}if(bits>0)out+=A[(val<<(5-bits))&31];return out}
function unb32(s){let bits=0,val=0;const out=[];for(const ch of s){const i=A.indexOf(ch);if(i<0)return null;val=(val<<5)|i;bits+=5;if(bits>=8){out.push((val>>>(bits-8))&255);bits-=8}val&=(1<<bits)-1}return out}
function keystream(s0,s1,s2,n){let x=((s0<<16)|(s1<<8)|s2)^0x9E3779B9;x>>>=0;if(!x)x=1;const k=[];for(let i=0;i<n;i++){x^=x<<13;x>>>=0;x^=x>>>17;x^=x<<5;x>>>=0;k.push(x&255)}return k}
function check(bytes){let c=7;for(const b of bytes)c=(c*31+b)&255;return c}
function encode(text){const p=[...new TextEncoder().encode(text)];const salt=[0,0,0].map(()=>Math.floor(Math.random()*256));const k=keystream(...salt,p.length);const body=p.map((b,i)=>b^k[i]);const s=b32([...salt,...body,check(p)]);return s.match(/.{1,4}/g).join('-')}
function decode(code){const s=code.toUpperCase().replace(/O/g,'0').replace(/[IL]/g,'1').replace(/[^0-9A-Z]/g,'');if(s.length<8)return null;const b=unb32(s);if(!b||b.length<5)return null;const salt=b.slice(0,3),body=b.slice(3,-1),c=b[b.length-1];const k=keystream(...salt,body.length);const p=body.map((x,i)=>x^k[i]);if(check(p)!==c)return null;try{return new TextDecoder('utf-8',{fatal:true}).decode(new Uint8Array(p))}catch(e){return null}}

const KEY='secret-santa-v1';
const sample=()=>({families:[
 {id:uid(),name:'Kumar family',members:[{id:uid(),name:'Arun',contact:''},{id:uid(),name:'Priya',contact:''},{id:uid(),name:'Dev',contact:''}]},
 {id:uid(),name:'Smith family',members:[{id:uid(),name:'Jack',contact:''},{id:uid(),name:'Emma',contact:''}]},
 {id:uid(),name:'Nguyen family',members:[{id:uid(),name:'Minh',contact:''},{id:uid(),name:'Lan',contact:''}]},
 {id:uid(),name:'Lisa',members:[{id:uid(),name:'Lisa',contact:''}]}],
 budget:'$30',date:'',link:'',results:null,sample:true});
let st,hadSaved=false;
try{const raw=localStorage.getItem(KEY);if(raw){st=JSON.parse(raw);hadSaved=true}}catch(e){}
if(!st)st=sample();
const hosted=/^https?:$/.test(location.protocol)&&!/claude\.(ai|site|com)|claudeusercontent/.test(location.hostname);
const selfLink=location.origin+location.pathname;
if(hosted&&!st.link)st.link=selfLink;
const qc=new URLSearchParams(location.search).get('c');
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};

let mode=(qc||location.hash==='#reveal')?'reveal':'org';
let error='',redrawArm=false,revealed=null,revealErr='',copied='';
const app=document.getElementById('app');

function people(){const p=[];st.families.forEach(f=>f.members.forEach(m=>{if(m.name.trim())p.push({name:m.name.trim(),contact:m.contact.trim(),fam:f.id})}));return p}
function solve(p){const n=p.length;const size={};p.forEach(x=>size[x.fam]=(size[x.fam]||0)+1);
 const giv=shuffle([...Array(n).keys()]).sort((a,b)=>size[p[b].fam]-size[p[a].fam]);
 const to=new Array(n).fill(-1),taken=new Array(n).fill(false);let steps=0;
 const go=k=>{if(k===n)return true;if(++steps>200000)return false;const g=giv[k];for(const r of shuffle([...Array(n).keys()])){if(taken[r]||r===g||p[r].fam===p[g].fam)continue;taken[r]=true;to[g]=r;if(go(k+1))return true;taken[r]=false}return false};
 return go(0)?to:null}

function doDraw(){error='';const p=people();
 const names=p.map(x=>x.name.toLowerCase());const dup=names.find((n,i)=>names.indexOf(n)!==i);
 if(p.length<3){error='Add at least three people.';return render()}
 if(dup){error=`Two people are called “${esc(p[names.indexOf(dup)].name)}”. Add a surname or initial so codes aren't confused.`;return render()}
 const size={};p.forEach(x=>size[x.fam]=(size[x.fam]||0)+1);const big=Math.max(...Object.values(size));
 if(big>p.length/2){error=`One family has ${big} of the ${p.length} people — more than half — so a no-family draw is impossible. Add more people or split that group.`;return render()}
 const to=solve(p);if(!to){error='Couldn’t find a valid draw. Try again or adjust the families.';return render()}
 st.results=p.map((g,i)=>({giver:g.name,contact:g.contact,code:encode(g.name+'\u0001'+p[to[i]].name),sent:false}));
 st.sample=false;redrawArm=false;save();render();
 document.getElementById('results')?.scrollIntoView({behavior:'smooth'})}

function message(r){const link=st.link.trim();
 return `Hi ${r.giver}! Your Secret Santa match is ready 🎁\n\nTap this link, then tap Reveal:\n${link?link+(link.includes('?')?'&':'?')+'c='+r.code:'(the Secret Santa page link)'}\n\nOr open the page, tap “Reveal my match” and enter your code: ${r.code}\n\nKeep it to yourself — no one else knows who you got!`+(st.budget?`\nBudget: ${st.budget}`:'')+(st.date?`\nGift exchange: ${st.date}`:'')}

function orgView(){
 const fams=st.families.map(f=>`<section class="card" data-f="${f.id}">
  <div class="famhead"><input data-k="fname" value="${esc(f.name)}" aria-label="Family name" placeholder="Family name"><button class="btn x" data-a="delfam" aria-label="Remove family">×</button></div>
  ${f.members.map(m=>`<div class="row" data-m="${m.id}"><input data-k="name" value="${esc(m.name)}" placeholder="Name" aria-label="Name"><input class="contact" data-k="contact" value="${esc(m.contact)}" placeholder="Mobile or email (optional)" aria-label="Mobile or email"><button class="btn x" data-a="delm" aria-label="Remove person">×</button></div>`).join('')}
  <button class="btn" data-a="addm">+ Add person</button></section>`).join('');
 const res=st.results?`<section class="card" id="results"><h2>Send each person their code</h2>
  <p class="muted">Nobody's match appears here. Copy each message and send it by text, WhatsApp or email — only the code inside unlocks it.</p>
  ${st.results.map((r,i)=>{const msg=message(r);const c=r.contact;const isMail=c.includes('@');
   const href=c?(isMail?`mailto:${encodeURIComponent(c)}?subject=${encodeURIComponent('Your Secret Santa match')}&body=${encodeURIComponent(msg)}`:`sms:${c.replace(/[^\d+]/g,'')}?&body=${encodeURIComponent(msg)}`):'';
   return `<div class="send ${r.sent?'done':''}"><div><b>${esc(r.giver)}</b><small>${c?esc(c):'No contact saved'} · code ${esc(r.code)}</small>${r.sent?'<span class="tick">Marked sent</span>':''}</div>
   <div class="acts"><button class="btn primary" data-a="copy" data-i="${i}">${copied===i?'Copied':'Copy message'}</button>${href?`<a class="btn" href="${href}">${isMail?'Email':'Text'}</a>`:''}<button class="btn" data-a="sent" data-i="${i}">${r.sent?'Undo':'Sent'}</button></div></div>`}).join('')}
  <p class="muted" style="margin-top:12px">Text/Email buttons open your phone's app if it allows; otherwise use Copy.</p>
  <button class="btn" data-a="redraw">${redrawArm?'Tap again to confirm — old codes stop mattering':'Redraw everyone'}</button></section>`:'';
 return `${st.sample?'<p class="note" style="margin:0 4px 10px">Sample names below — replace them with your group.</p>':''}
 <section class="card"><h2>Who's playing?</h2><p class="muted">Put each household in its own group. People in the same group will never draw each other. Someone on their own gets a group of one.</p>
 <div class="grid2"><div><label for="budget">Budget</label><input id="budget" data-g="budget" value="${esc(st.budget)}" placeholder="$30"></div>
 <div><label for="date">Exchange date</label><input id="date" data-g="date" value="${esc(st.date)}" placeholder="Christmas Day lunch"></div></div>
 <div style="margin-top:10px"><label for="link">Link to this page (to put in messages)</label><input id="link" data-g="link" value="${esc(st.link)}" placeholder="Paste the share link"></div></section>
 ${fams}
 <div class="grid2" style="margin-bottom:14px"><button class="btn" data-a="addfam">+ Add family</button><button class="btn" data-a="addsingle">+ Add single person</button></div>
 ${error?`<p class="err">${error}</p>`:''}
 ${st.results?'':'<button class="btn primary big" data-a="draw">Draw names</button>'}
 ${res}`}

function revView(){
 if(revealed)return `<section class="card" style="background:transparent;box-shadow:none;padding:0"><div class="tagzone"><div class="tag">
  <p class="to">${esc(revealed.giver)}, you're Secret Santa for</p><p class="name">${esc(revealed.to)}</p>
  <p class="meta">Keep it secret until the exchange!</p></div></div>
  <button class="btn big" data-a="hide" style="margin-top:18px">Hide it</button></section>`;
 return `<section class="card"><h2>Open your match</h2><p class="muted">Enter the code from your message. Dashes and capitals don't matter.</p>
 <form id="revForm"><input id="code" class="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX" aria-label="Your code" value="${esc(qc||'')}">
 ${revealErr?`<p class="err" style="margin-top:10px">${revealErr}</p>`:''}
 <button class="btn primary big" style="margin-top:12px">Reveal</button></form></section>`}

function render(){document.getElementById('tabOrg').setAttribute('aria-pressed',mode==='org');document.getElementById('tabRev').setAttribute('aria-pressed',mode==='reveal');
 app.innerHTML=mode==='org'?orgView():revView()}

const fam=el=>st.families.find(f=>f.id===el.closest('[data-f]')?.dataset.f);
app.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.g){st[t.dataset.g]=t.value;save();return}
 const f=fam(t);if(!f)return;
 if(t.dataset.k==='fname'){f.name=t.value}else{const m=f.members.find(m=>m.id===t.closest('[data-m]').dataset.m);m[t.dataset.k]=t.value}
 st.sample=false;save()});
app.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,f=fam(b);
 if(a!=='redraw')redrawArm=false;
 if(a==='addm'){f.members.push({id:uid(),name:'',contact:''})}
 else if(a==='delm'){f.members=f.members.filter(m=>m.id!==b.closest('[data-m]').dataset.m);if(!f.members.length)st.families=st.families.filter(x=>x!==f)}
 else if(a==='delfam'){st.families=st.families.filter(x=>x!==f)}
 else if(a==='addfam'){st.families.push({id:uid(),name:'New family',members:[{id:uid(),name:'',contact:''},{id:uid(),name:'',contact:''}]})}
 else if(a==='addsingle'){st.families.push({id:uid(),name:'',members:[{id:uid(),name:'',contact:''}]})}
 else if(a==='draw'){return doDraw()}
 else if(a==='redraw'){if(!redrawArm){redrawArm=true}else{st.results=null;redrawArm=false;save();render();return doDraw()}}
 else if(a==='copy'){const i=+b.dataset.i;try{await navigator.clipboard.writeText(message(st.results[i]));copied=i}catch(err){copied=-1;b.textContent='Copy blocked — select the code'};if(copied===-1)return;setTimeout(()=>{copied='';render()},1800)}
 else if(a==='sent'){const r=st.results[+b.dataset.i];r.sent=!r.sent}
 else if(a==='hide'){revealed=null}
 if(a.startsWith('add')||a.startsWith('del'))st.results=st.results&&null;
 save();render();
 if(a==='addm'||a==='addfam'||a==='addsingle'){const ins=app.querySelectorAll('input[data-k="name"]');ins[ins.length-1]?.focus()}});
app.addEventListener('submit',e=>{e.preventDefault();const v=decode(document.getElementById('code').value);
 if(!v||v.split('\u0001').length<2){revealErr='That code doesn’t look right. Check for a missing character.';revealed=null}
 else{const[g,t,bu,d]=v.split('\u0001');revealed={giver:g,to:t,budget:bu,date:d};revealErr=''}render()});
document.getElementById('tabOrg').onclick=()=>{mode='org';revealed=null;render()};
document.getElementById('tabRev').onclick=()=>{mode='reveal';render()};
addEventListener('hashchange',()=>{if(location.hash==='#reveal')mode='reveal';if(location.hash==='#organise')mode='org';render()});
render();
}
</script>
</body>
</html>
